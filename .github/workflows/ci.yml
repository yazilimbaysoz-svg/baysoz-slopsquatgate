# Baysöz Labs <baysozlabs@proton.me> — zero-service CI for the dependency-origin oracle.
name: slopsquatgate CI — Baysöz Labs <baysozlabs@proton.me>

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
      - name: Install environment — Baysöz Labs <baysozlabs@proton.me>
        run: |
          uv venv
          uv pip install -e .
          uv pip install pytest ruff semgrep
      - name: Tests — Baysöz Labs <baysozlabs@proton.me>
        run: uv run pytest -q
      - name: Lint and safety — Baysöz Labs <baysozlabs@proton.me>
        run: uv run ruff check --select E,F,W,S,B .
      - name: Security scan — Baysöz Labs <baysozlabs@proton.me>
        run: uv run semgrep --config p/default --error .
